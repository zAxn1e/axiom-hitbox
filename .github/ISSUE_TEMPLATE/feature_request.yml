name: 🚀 Feature Request
description: Have an idea or enhancement for Axiom? We'd love to hear it!
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### ✨ Have a feature idea for Axiom?
        We appreciate community feedback! Tell us about your idea below so we can discuss how to best implement it.

  - type: dropdown
    id: component
    attributes:
      label: Which area would this feature enhance?
      description: Select the module or area for your feature proposal.
      options:
        - "🎯 Axiom.Hitbox (Spatial Queries, Shapes, Detection)"
        - "🔄 Axiom.Hitbox (Pooling, Lifecycle, Visualization)"
        - "⚡ Axiom.Core (Signal, Scheduler, Timer, Concurrency)"
        - "👤 Axiom.Service (CharacterService & Infrastructure)"
        - "🏷️ Luau Types & DX / Developer Tooling"
        - "💡 Other / General Idea"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem or use case does this solve?
      description: Describe the goal, current pain point, or why this feature would be helpful.
      placeholder: "e.g., Currently it takes extra setup code to query continuous hitboxes for sphere shapes..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe your proposed feature
      description: Tell us how you imagine this feature working.
      placeholder: "e.g., Add a `:SetShape(shapeType, params)` method to quickly switch shapes..."
    validations:
      required: true

  - type: textarea
    id: example_usage
    attributes:
      label: Code example (optional)
      description: Show a quick example of how you'd like to use this in code.
      render: lua
      placeholder: |
        local Axiom = require(path.to.Axiom)

        -- Proposed syntax:
        local hitbox = Axiom.Hitbox.new(...)
        hitbox:SetShape("Sphere", { Radius = 5 })
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context or alternatives considered (optional)
      description: Share any alternative workarounds or extra details you've considered.
      placeholder: "Any additional details or thoughts"
    validations:
      required: false
