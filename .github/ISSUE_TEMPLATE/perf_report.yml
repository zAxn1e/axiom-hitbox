name: ⚡ Performance / Memory Issue
description: Notice high memory usage, CPU spikes, or lag in hot paths? Report it here!
title: "[Perf]: "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚡ Help us keep Axiom ultra-fast!
        Axiom is built for high-frequency performance. If you notice any unexpected memory churn, frame drops, or micro-stuttering, please let us know!

  - type: dropdown
    id: component
    attributes:
      label: Which hot path is affected?
      description: Select the area where performance issues were noticed.
      options:
        - "🎯 Spatial Queries (OverlapParams / Shapecast / Raycast)"
        - "🔄 Pool Recycling & Object Creation"
        - "⚡ Core Scheduler & Signal Dispatch"
        - "👤 CharacterService Lifecycle Events"
        - "❓ Other / Not Sure"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the performance issue
      description: Tell us what performance degradation or memory spike you observed.
      placeholder: "e.g., When running 150 active hitboxes simultaneously, memory allocation increases by..."
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: Microprofiler data or details (optional)
      description: Share any Microprofiler numbers, memory stats, or active hitbox counts.
      placeholder: |
        - Active Hitboxes: 100
        - Frame Time / Microprofiler Cost: ~1.5ms
        - Memory increase / Allocation rate: ~30 KB/s
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Code sample or benchmark script (optional)
      description: Provide the script or test setup you used to measure this.
      render: lua
      placeholder: |
        local Axiom = require(path.to.Axiom)

        -- Benchmark setup:
    validations:
      required: false
