name: 🐛 Bug Report
description: Found a bug, unexpected error, or type warning? Let us know so we can fix it!
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 👋 Thanks for helping improve Axiom!
        If something isn't working as expected, please fill out the fields below. Don't worry if you don't have all the details—just provide as much as you can!

  - type: dropdown
    id: component
    attributes:
      label: Which area is affected?
      description: Select the component where the issue occurs (if you're not sure, pick "Other / Not Sure").
      options:
        - "🎯 Axiom.Hitbox (Spatial Detection, Lifecycle, Shapes, Visualizer)"
        - "🔄 Axiom.Hitbox (Pool Recycling & Memory)"
        - "⚡ Axiom.Core (Signal, Scheduler, Timer)"
        - "🤝 Axiom.Core (Concurrency, Transaction, Await)"
        - "👤 Axiom.Service (CharacterService)"
        - "🏷️ Luau Types (--!strict Warnings & Typing)"
        - "📚 Documentation / Examples"
        - "❓ Other / Not Sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Axiom Version
      description: What version of Axiom are you using?
      placeholder: "e.g., v1.4.0, latest release, or main branch"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug or unexpected behavior as clearly as possible.
      placeholder: "e.g., When I call hitbox:Stop(), the visualizer remains visible on screen..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce or code sample
      description: Share a short code snippet or step-by-step instructions so we can reproduce it.
      render: lua
      placeholder: |
        local Axiom = path.to.Axiom
        local Hitbox = require(Axiom.Hitbox)

        -- Example setup that reproduces the bug:
        local hitbox = Hitbox.new(...)
        hitbox:Start()
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Tell us what should have happened instead.
      placeholder: "e.g., The visualizer should disappear immediately after calling Stop()."
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Where are you testing?
      description: What environment are you running in?
      options:
        - "Roblox Studio (Play Solo / Test)"
        - "Roblox Live Server"
        - "Roblox Client"
        - "Rojo / Lune / Custom Pipeline"
        - "Other"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error logs or screenshots (optional)
      description: Paste any stack trace error messages or drag & drop screenshots here.
      render: shell
      placeholder: "Paste output log or error stack trace here if available"
    validations:
      required: false
