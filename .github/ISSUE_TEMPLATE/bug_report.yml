name: 🐛 Bug Report
description: Report a bug, crash, unexpected behavior, or Luau type solver issue in Axiom
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Axiom Framework!
        Please fill out the form below to help us reproduce and resolve the problem efficiently.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Axiom is experiencing the issue?
      options:
        - "Axiom.Hitbox (Spatial Detection / Lifecycle / Shapes / Visualization)"
        - "Axiom.Hitbox (Pool Recycling / Memory Allocation)"
        - "Axiom.Core (Signal / Scheduler / Timer)"
        - "Axiom.Core (Concurrency / Transaction / Await)"
        - "Axiom.Service (CharacterService / Character Lifecycle)"
        - "Luau Type System (--!strict Types / Type Solver Warnings)"
        - "Documentation / Examples"
        - "Other / Unsure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Axiom Version
      description: What version of Axiom are you using? (e.g., v1.4.0, main branch commit hash)
      placeholder: "e.g., v1.4.0"
    validations:
      required: true

  - type: dropdown
    id: luau_mode
    attributes:
      label: Luau Type Checker Mode
      description: What mode is your script running in?
      options:
        - "--!strict"
        - "--!nonstrict"
        - "--!nocheck"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: "Describe what happens and what you expected to happen."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal Luau code snippet or step-by-step instructions to reproduce the issue.
      render: lua
      placeholder: |
        local Axiom = require(path.to.Axiom)
        local hitbox = Axiom.Hitbox.new(...)
        hitbox:Start()
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: Hitbox fires OnHit signal without errors when character despawns.
        Actual: Throws nil reference error in CharacterService line 42.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Execution Environment
      description: Where does this bug occur?
      options:
        - "Roblox Server (Live Game)"
        - "Roblox Server (Studio Test)"
        - "Roblox Client"
        - "Rojo + Luau / Lune Unit Testing"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Stack Trace / Error Logs
      description: Paste any error messages, stack tracebacks, or output log text here.
      render: shell
      placeholder: "Script 'Axiom.Service.CharacterService', Line 42 - ... "
    validations:
      required: false
